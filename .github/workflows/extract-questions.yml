name: 문제 추출

# 추출기(tools/extract)를 돌려 결과를 서버의 import API 로 보낸다.
#
# 서버에서 추출기를 돌리지 않는 이유:
#   - tree-sitter 문법은 Python 생태계가 압도적으로 낫다 (pip 한 줄 대 플랫폼별 네이티브)
#   - 추출은 몇 분 걸린다. HTTP 요청 안에서 못 돌리고 비동기 잡 관리가 필요해진다
#   - 추출기가 GitHub API·raw 를 때린다. 여기가 그 네트워크 안이다
#
# 로컬에서 같은 일을 하려면:
#   curl -s -H "x-admin-token: $TOKEN" $API/admin/questions/pins > /tmp/pins.json
#   .venv/bin/python tools/extract/extract.py --pin-from /tmp/pins.json --out /tmp/q.json
#   curl -X POST $API/admin/questions/import -H "x-admin-token: $TOKEN" \
#        -H 'Content-Type: application/json' --data-binary @/tmp/q.json

on:
  # Actions 탭에 "Run workflow" 버튼이 생긴다. 이것이 주된 실행 방법이다 —
  # 추출은 소스 목록이나 필터를 고쳤을 때 돌리는 작업이고, 그때는 어차피
  # 여기에 코드를 밀어넣은 직후다.
  workflow_dispatch:
    inputs:
      per_file:
        description: "파일당 최대 메서드 문제 수"
        default: "6"
      per_file_variable:
        description: "파일당 최대 변수 문제 수"
        default: "3"
      allow_retire:
        description: "문제가 내려가도 성공으로 둘지 (필터를 조일 때만 켠다)"
        type: boolean
        default: false
      dry_run:
        description: "서버로 보내지 않고 결과만 본다"
        type: boolean
        default: false

  # 정기 실행은 꺼 두었다.
  #
  # 커밋을 고정해 돌리므로 같은 입력에 같은 결과가 나온다 — 정기 실행은
  # 대개 아무것도 바꾸지 않는다. 문제가 바뀌는 건 sources.json 이나 필터를
  # 고쳤을 때이고, 그건 사람이 커밋한 직후다.
  #
  # 켜고 싶으면 주석을 풀되, allow_retire 가 없으므로 문제가 내려가면
  # 실패로 끝난다 (그게 의도다 — 조용히 사라지는 것보다 알림이 낫다).
  # schedule:
  #   - cron: "0 18 * * 0"  # 매주 월요일 03:00 KST

# 두 번이 겹쳐 돌면 서로의 결과를 덮어쓴다. 앞선 것이 끝날 때까지 기다린다.
concurrency:
  group: extract-questions
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 설정 확인
        # dry_run 은 서버를 쓰지 않으므로 시크릿도 필요 없다. 서버를 띄우기 전에
        # 추출기만 돌려 보고 싶을 때 쓸 수 있어야 한다.
        if: ${{ inputs.dry_run != true }}
        env:
          API: ${{ secrets.NAMEKATA_API_URL }}
          TOKEN: ${{ secrets.NAMEKATA_ADMIN_TOKEN }}
        run: |
          if [ -z "$API" ]; then
            echo "::error::NAMEKATA_API_URL 시크릿이 없습니다. 서버 주소를 넣어야 합니다."
            echo "설정: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::NAMEKATA_ADMIN_TOKEN 시크릿이 없습니다. 서버의 같은 값을 넣어야 합니다."
            exit 1
          fi

      - name: 추출기 테스트
        # mask() 가 깨지면 답이 보이는 문제가 나간다. 추출 전에 막는다.
        run: pytest tools/extract -q

      - name: 고정할 커밋 받아오기
        env:
          API: ${{ secrets.NAMEKATA_API_URL }}
          TOKEN: ${{ secrets.NAMEKATA_ADMIN_TOKEN }}
        run: |
          # 이미 있는 문제들이 쓰던 커밋. 최신 커밋으로 옮겨가면 줄 번호가
          # 밀려 문제 id 가 통째로 바뀌고, 쌓인 제출·검수 기록이 갈 곳을 잃는다.
          #
          # DB 가 비어 있으면 빈 목록이 와서 추출기가 최신 커밋을 고른다.
          # 첫 실행에서는 그게 맞다.
          #
          # dry_run 은 서버에 아무것도 보내지 않으므로 고정할 필요가 없다.
          # 빈 목록을 두면 추출기가 최신 커밋을 고른다 — id 가 지금 DB 와
          # 다르게 나올 수 있지만, 어차피 보내지 않으니 상관없다.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "[]" > pins.json
            echo "dry_run 이므로 커밋을 고정하지 않는다 (최신 커밋을 쓴다)"
            exit 0
          fi

          curl -sS --fail-with-body \
            -H "x-admin-token: $TOKEN" \
            "${API%/}/admin/questions/pins" > pins.json
          echo "고정할 문제 $(python -c 'import json;print(len(json.load(open("pins.json"))))')개"

      - name: 문제 추출
        run: |
          python tools/extract/extract.py \
            --pin-from pins.json \
            --per-file "${{ inputs.per_file || 6 }}" \
            --per-file-variable "${{ inputs.per_file_variable || 3 }}" \
            --out questions.json | tee extract.log

      - name: 결과 요약
        run: |
          {
            echo "## 추출 결과"
            echo '```'
            tail -30 extract.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 서버로 보내기
        if: ${{ inputs.dry_run != true }}
        env:
          API: ${{ secrets.NAMEKATA_API_URL }}
          TOKEN: ${{ secrets.NAMEKATA_ADMIN_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST \
            "${API%/}/admin/questions/import" \
            -H "x-admin-token: $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @questions.json > report.json
          cat report.json

      - name: 내려간 문제 확인
        if: ${{ inputs.dry_run != true }}
        env:
          ALLOW_RETIRE: ${{ inputs.allow_retire }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          report = json.load(open("report.json"))
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [
              "## 반영 결과",
              "",
              "| | 개수 |",
              "|---|---|",
              f"| 신규 | {report['inserted']} |",
              f"| 갱신 | {report['updated']} |",
              f"| 내림 | {report['retired']} |",
              f"| 되살림 | {report['revived']} |",
          ]

          retired = report["retired"]
          if retired:
              ids = report.get("retiredIds") or []
              lines += ["", "### 내려간 문제", ""]
              lines += [f"- `{qid}`" for qid in ids] or ["- (너무 많아 생략)"]
              lines += [
                  "",
                  "내려간 문제는 지워지지 않지만 더 이상 풀 수 없다. 그 문제에 걸려 "
                  "있던 제출·검수 기록은 남은 채로 가리킬 곳을 잃는다.",
              ]
          summary.write_text(summary.read_text() + "\n".join(lines) + "\n")

          if retired and os.environ.get("ALLOW_RETIRE") != "true":
              print(f"::error::문제 {retired}개가 내려갔습니다. "
                    "의도한 것이면 allow_retire 를 켜고 다시 돌리세요.")
              sys.exit(1)
          PY

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questions
          # 커밋하지 않는다. DB 가 원본이고, 이 파일은 그 과정의 중간 산출물이다.
          # 다만 무엇을 보냈는지 확인할 수 있게 실행 기록에는 붙여 둔다.
          path: |
            questions.json
            pins.json
            extract.log
          retention-days: 30
          if-no-files-found: warn
